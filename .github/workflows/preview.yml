name: deployment-gate

# Runs against real Vercel deployments, where vercel.json headers (the strict
# CSP) are actually applied. GitHub reads `deployment_status` workflows from the
# DEFAULT branch, so this file must exist there before it fires for any branch.
#
# Preview deployments are behind Deployment Protection: the bypass secret is
# passed to Playwright as an environment variable only. It is never echoed, and
# Playwright tracing is forced off (playwright.config.ts) so no artifact can
# contain it in recorded request headers.
on:
  deployment_status:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deployment-gate-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Event fields reach the shell only as environment variables, never by
      # interpolation into script text.
      DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      DEPLOY_ENV: ${{ github.event.deployment.environment }}
      DEPLOY_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Classify deployment environment
        id: kind
        run: |
          env_lc="$(printf '%s' "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]')"
          case "$env_lc" in
            preview*)    echo "value=preview" >> "$GITHUB_OUTPUT" ;;
            production*) echo "value=production" >> "$GITHUB_OUTPUT" ;;
            *)           echo "value=other" >> "$GITHUB_OUTPUT"
                         echo "Ignoring deployment environment: $DEPLOY_ENV" ;;
          esac

      - name: Require bypass secret (preview)
        if: steps.kind.outputs.value == 'preview'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not configured; refusing to test the Vercel authentication page."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.kind.outputs.value != 'other'
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        if: steps.kind.outputs.value != 'other'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.kind.outputs.value != 'other'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.kind.outputs.value != 'other'
        run: npx playwright install --with-deps chromium

      - name: E2E and header assertions against the preview
        if: steps.kind.outputs.value == 'preview'
        env:
          PREVIEW_URL: ${{ env.DEPLOY_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --reporter=list

      - name: Header assertions and load check against production
        if: steps.kind.outputs.value == 'production'
        env:
          PREVIEW_URL: ${{ env.DEPLOY_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/preview-headers.spec.ts e2e/portfolio.spec.ts --reporter=list -g "served edge headers|zero console errors"

      - name: Upload failure artifacts
        if: failure() && steps.kind.outputs.value != 'other'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gate-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report commit status
        if: always() && steps.kind.outputs.value != 'other'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.value }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$KIND" = "preview" ]; then context="preview-e2e"; else context="production-smoke"; fi
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"; description="Deployment verified"
          else
            state="failure"; description="Deployment verification failed"
          fi
          gh api "repos/${REPO}/statuses/${DEPLOY_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="$RUN_URL"
